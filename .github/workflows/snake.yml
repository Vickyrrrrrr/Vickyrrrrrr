name: Generate Snake Animation

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Vickyrrrrrr
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#0a0a0f,#1e3a8a,#3b82f6,#60a5fa,#93c5fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Use peaceiris instead of crazy-max for reliable deployment
      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation"      # Generate the holographic cyber-snake animation
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Vickyrrrrrr
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#0a0a0f,#1e3a8a,#3b82f6,#60a5fa,#93c5fd
            dist/github-contribution-grid-snake-extraordinary.svg?color_snake=white&color_dots=#020617,#1e1b4b,#312e81,#3b82f6,#60a5fa
      
      # Push the generated files to the output branch
      # Debug: show git and filesystem state before pushing
      - name: Debug git and filesystem info
        run: |
          git --version
          git config --list
          git remote -v
          git branch --show-current || echo "no current branch"
          git status --porcelain
          ls -la
          echo "dist contents:" && ls -la dist || true
        continue-on-error: true

      - name: Debug dry-run push to output branch
        run: |
          echo "Setting remote URL to use GITHUB_TOKEN for auth"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin
          echo "Attempting dry-run push to create/update output branch"
          git push --dry-run origin HEAD:refs/heads/output || true
        continue-on-error: true

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
