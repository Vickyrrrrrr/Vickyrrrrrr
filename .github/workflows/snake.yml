name: Generate Snake Animation

# Give the workflow explicit permissions so the GITHUB_TOKEN can push to branches
permissions:
  contents: write

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows manual trigger
  workflow_dispatch:
  
  # Run on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Checkout the repository (persist credentials so push can authenticate)
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
      
      # Ensure output directory exists
      - name: Prepare dist directory
        run: mkdir -p dist
      
      # Generate the snake animation
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Vickyrrrrrr
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
      
      # Push the generated files to the output branch
      # Debug: show git and filesystem state before pushing
      - name: Debug: git and filesystem info
        run: |
          git --version
          git config --list
          git remote -v
          git branch --show-current || echo "no current branch"
          git status --porcelain
          ls -la
          echo "dist contents:" && ls -la dist || true
        continue-on-error: true

      - name: Debug: dry-run push to output branch
        run: |
          echo "Setting remote URL to use GITHUB_TOKEN for auth"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin
          echo "Attempting dry-run push to create/update output branch"
          git push --dry-run origin HEAD:refs/heads/output || true
        continue-on-error: true

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
